<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI云</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    background: #f5f6f8;
    color: #1f2329;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 16px;
    background: #fff;
    border-bottom: 1px solid #e8eaed;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; }
  header .header-actions { display: flex; gap: 12px; }
  header button {
    border: none;
    background: none;
    color: #8a9099;
    font-size: 13px;
    padding: 4px 6px;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    -webkit-overflow-scrolling: touch;
  }
  .tip { color: #8a9099; font-size: 13px; text-align: center; margin-top: 40px; }
  .turn {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user {
    align-self: flex-end;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    background: #3370ff;
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.user .msg-actions {
    align-self: flex-end;
    display: flex;
    gap: 10px;
    margin-top: 2px;
  }
  .msg.user .msg-actions button {
    padding: 0;
    border: none;
    background: none;
    color: rgba(255, 255, 255, .7);
    font-size: 11px;
  }
  .msg.user .msg-actions .delete { color: rgba(255, 220, 220, .85); }
  .msg.user.editing {
    width: 80%;
    max-width: 80%;
    background: #fff;
    border: 1px solid #d9dde3;
    color: #1f2329;
  }
  .msg.user.editing textarea {
    width: 100%;
    min-height: 52px;
    padding: 6px 8px;
    border: 1px solid #d9dde3;
    border-radius: 6px;
    font: inherit;
    font-size: 14px;
    resize: vertical;
    outline: none;
  }
  .msg.user.editing textarea:focus { border-color: #3370ff; }
  .msg.user .actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 8px;
  }
  .msg.user .actions button {
    height: 28px;
    padding: 0 10px;
    border: none;
    border-radius: 6px;
    font-size: 12px;
  }
  .btn-save { background: #3370ff; color: #fff; }
  .btn-cancel { background: #f2f3f5; color: #1f2329; }
  .msg.bot {
    align-self: flex-start;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    background: #fff;
    border: 1px solid #e8eaed;
    border-bottom-left-radius: 4px;
  }
  .msg.bot .speak {
    align-self: flex-end;
    margin-top: 2px;
    padding: 0;
    border: none;
    background: none;
    color: #8a9099;
    font-size: 11px;
  }
  .msg.error {
    align-self: flex-start;
    background: #fff1f0;
    color: #d4380d;
    border: 1px solid #ffccc7;
  }
  .msg.pending { color: #8a9099; }
  form {
    display: flex;
    gap: 8px;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: #fff;
    border-top: 1px solid #e8eaed;
  }
  #input {
    flex: 1;
    resize: none;
    height: 42px;
    padding: 10px 12px;
    font: inherit;
    font-size: 14px;
    border: 1px solid #d9dde3;
    border-radius: 8px;
    outline: none;
  }
  #input:focus { border-color: #3370ff; }
  #send {
    padding: 0 18px;
    height: 42px;
    border: none;
    border-radius: 8px;
    background: #3370ff;
    color: #fff;
    font-size: 14px;
  }
  #send:disabled { background: #a8c0ff; }
</style>
</head>
<body>
<header>
  <h1>AI云</h1>
  <div class="header-actions">
    <button id="voice" type="button">语音</button>
    <button id="clear" type="button">清空</button>
    <button id="reset" type="button">更换 Key</button>
  </div>
</header>

<main id="messages">
  <div class="tip">输入内容开始对话</div>
</main>

<form id="form">
  <textarea id="input" placeholder="说点什么…"></textarea>
  <button id="send" type="submit">发送</button>
</form>

<script>
  var messagesEl = document.getElementById('messages');
  var form = document.getElementById('form');
  var input = document.getElementById('input');
  var sendBtn = document.getElementById('send');
  var pending = {};

  window.__onResult = function (id, jsonText) {
    var cb = pending[id];
    if (!cb) return;
    delete pending[id];
    var data;
    try { data = JSON.parse(jsonText); } catch (e) { data = { error: '返回解析失败' }; }
    cb(data);
  };

  function callChat(text) {
    return new Promise(function (resolve) {
      var id = 'c' + Date.now() + Math.floor(Math.random() * 1000);
      pending[id] = resolve;
      try {
        Android.chat(text, id);
      } catch (e) {
        delete pending[id];
        resolve({ error: '无法连接应用内核' });
      }
    });
  }

  var STORAGE_KEY = 'aichat_history';
  var turns = [];

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function saveHistory() {
    var data = turns.map(function (t) {
      return { text: t.text, reply: t.reply, error: t.error };
    });
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) { /* 存储满时忽略 */ }
  }

  function showTip() {
    messagesEl.innerHTML = '';
    var tip = document.createElement('div');
    tip.className = 'tip';
    tip.textContent = '输入内容开始对话';
    messagesEl.appendChild(tip);
  }

  function hideTip() {
    var tip = messagesEl.querySelector('.tip');
    if (tip) tip.remove();
  }

  function renderBot(t) {
    t.bot.className = 'msg bot' + (t.error ? ' error' : '') + (t.pending ? ' pending' : '');
    t.bot.innerHTML = '';

    var span = document.createElement('span');
    span.textContent = t.pending ? '…' : (t.reply || '');
    t.bot.appendChild(span);

    if (!t.pending && t.reply && !t.error) {
      var speak = document.createElement('button');
      speak.type = 'button';
      speak.className = 'speak';
      speak.textContent = '朗读';
      t.bot.appendChild(speak);
    }
  }

  function speakText(text) {
    if (!text) return;
    if (window.Android && Android.speak) {
      Android.speak(text);
    } else if (window.speechSynthesis) {
      try {
        speechSynthesis.cancel();
        speechSynthesis.speak(new SpeechSynthesisUtterance(text));
      } catch (e) { /* 浏览器不支持时忽略 */ }
    }
  }

  function renderTurn(t) {
    t.user.innerHTML = '';
    t.user.classList.toggle('editing', t.editing);

    if (t.editing) {
      var ta = document.createElement('textarea');
      ta.className = 'editor';
      ta.value = t.text;

      var actions = document.createElement('div');
      actions.className = 'actions';
      var save = document.createElement('button');
      save.type = 'button';
      save.className = 'btn-save';
      save.textContent = '保存并重新生成';
      var cancel = document.createElement('button');
      cancel.type = 'button';
      cancel.className = 'btn-cancel';
      cancel.textContent = '取消';
      actions.append(save, cancel);
      t.user.append(ta, actions);
      setTimeout(function () {
        ta.focus();
        ta.setSelectionRange(ta.value.length, ta.value.length);
      }, 0);
    } else {
      var span = document.createElement('span');
      span.textContent = t.text;

      var actions = document.createElement('div');
      actions.className = 'msg-actions';
      var edit = document.createElement('button');
      edit.type = 'button';
      edit.className = 'edit';
      edit.textContent = '修改';
      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'delete';
      del.textContent = '删除';
      actions.append(edit, del);
      t.user.append(span, actions);
    }
  }

  function addTurn(text, reply, error) {
    var el = document.createElement('div');
    el.className = 'turn';

    var user = document.createElement('div');
    user.className = 'msg user';

    var bot = document.createElement('div');
    bot.className = 'msg bot';

    el.append(user, bot);
    messagesEl.appendChild(el);

    var t = {
      el: el,
      user: user,
      bot: bot,
      text: text,
      reply: reply || '',
      error: !!error,
      editing: false,
      pending: false
    };
    el._turn = t;
    turns.push(t);
    renderTurn(t);
    renderBot(t);
    return t;
  }

  function restoreHistory() {
    var saved;
    try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch (e) { saved = []; }
    if (!Array.isArray(saved) || !saved.length) return;
    hideTip();
    saved.forEach(function (item) {
      addTurn(item.text || '', item.reply || '', !!item.error);
    });
    scrollToBottom();
  }

  function removeTurn(t) {
    var index = turns.indexOf(t);
    if (index < 0) return;
    turns.splice(index, 1);
    t.el.remove();
    saveHistory();
    if (!turns.length) showTip();
  }

  function clearAll() {
    turns = [];
    localStorage.removeItem(STORAGE_KEY);
    showTip();
  }

  function requestDelete(t) {
    var index = turns.indexOf(t);
    if (index < 0) return;
    if (window.Android && Android.confirmDeleteTurn) {
      Android.confirmDeleteTurn(index);
    } else {
      removeTurn(t);
    }
  }

  // 供原生确认框回调
  window.__clearAll = clearAll;
  window.__deleteTurn = function (index) {
    var t = turns[index];
    if (t) removeTurn(t);
  };

  function ask(t) {
    t.pending = true;
    t.error = false;
    t.reply = '';
    renderBot(t);
    return callChat(t.text).then(function (data) {
      t.pending = false;
      if (data && data.reply) {
        t.reply = data.reply;
        t.error = false;
      } else {
        t.reply = (data && data.error) || '请求失败';
        t.error = true;
      }
      renderBot(t);
      saveHistory();
      scrollToBottom();
    });
  }

  messagesEl.addEventListener('click', function (e) {
    var el = e.target.closest('.turn');
    if (!el || !el._turn) return;
    var t = el._turn;

    if (e.target.closest('.speak')) {
      speakText(t.reply);
    } else if (e.target.closest('.edit')) {
      t.editing = true;
      renderTurn(t);
    } else if (e.target.closest('.delete')) {
      requestDelete(t);
    } else if (e.target.closest('.btn-cancel')) {
      t.editing = false;
      renderTurn(t);
    } else if (e.target.closest('.btn-save')) {
      var ta = t.user.querySelector('.editor');
      var value = ta.value.trim();
      if (!value) { ta.focus(); return; }
      t.text = value;
      t.editing = false;
      renderTurn(t);
      ask(t);
    }
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text || sendBtn.disabled) return;

    hideTip();
    input.value = '';
    var t = addTurn(text);
    saveHistory();
    sendBtn.disabled = true;
    sendBtn.textContent = '思考中…';

    ask(t).then(function () {
      sendBtn.disabled = false;
      sendBtn.textContent = '发送';
    });
  });

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  document.getElementById('voice').addEventListener('click', function () {
    if (window.Android && Android.chooseVoice) {
      Android.chooseVoice();
    } else {
      alert('语音设置请在 App 内使用');
    }
  });

  document.getElementById('clear').addEventListener('click', function () {
    if (window.Android && Android.confirmClearHistory) {
      Android.confirmClearHistory();
    } else {
      clearAll();
    }
  });

  document.getElementById('reset').addEventListener('click', function () {
    // 确认框由原生层弹出，避免 WebView 不支持 confirm 导致点击无效
    Android.resetKey();
  });

  restoreHistory();
</script>
</body>
</html>
