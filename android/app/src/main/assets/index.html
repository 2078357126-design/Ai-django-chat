<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI云</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    background: #f5f6f8;
    color: #1f2329;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 16px;
    background: #fff;
    border-bottom: 1px solid #e8eaed;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; }
  header button {
    border: none;
    background: none;
    color: #8a9099;
    font-size: 13px;
    padding: 4px 6px;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    -webkit-overflow-scrolling: touch;
  }
  .tip { color: #8a9099; font-size: 13px; text-align: center; margin-top: 40px; }
  .turn {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user {
    align-self: flex-end;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    background: #3370ff;
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.user .edit {
    align-self: flex-end;
    margin-top: 2px;
    padding: 0;
    border: none;
    background: none;
    color: rgba(255, 255, 255, .7);
    font-size: 11px;
  }
  .msg.user.editing {
    width: 80%;
    max-width: 80%;
    background: #fff;
    border: 1px solid #d9dde3;
    color: #1f2329;
  }
  .msg.user.editing textarea {
    width: 100%;
    min-height: 52px;
    padding: 6px 8px;
    border: 1px solid #d9dde3;
    border-radius: 6px;
    font: inherit;
    font-size: 14px;
    resize: vertical;
    outline: none;
  }
  .msg.user.editing textarea:focus { border-color: #3370ff; }
  .msg.user .actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 8px;
  }
  .msg.user .actions button {
    height: 28px;
    padding: 0 10px;
    border: none;
    border-radius: 6px;
    font-size: 12px;
  }
  .btn-save { background: #3370ff; color: #fff; }
  .btn-cancel { background: #f2f3f5; color: #1f2329; }
  .msg.bot {
    align-self: flex-start;
    background: #fff;
    border: 1px solid #e8eaed;
    border-bottom-left-radius: 4px;
  }
  .msg.error {
    align-self: flex-start;
    background: #fff1f0;
    color: #d4380d;
    border: 1px solid #ffccc7;
  }
  .msg.pending { color: #8a9099; }
  form {
    display: flex;
    gap: 8px;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: #fff;
    border-top: 1px solid #e8eaed;
  }
  #input {
    flex: 1;
    resize: none;
    height: 42px;
    padding: 10px 12px;
    font: inherit;
    font-size: 14px;
    border: 1px solid #d9dde3;
    border-radius: 8px;
    outline: none;
  }
  #input:focus { border-color: #3370ff; }
  #send {
    padding: 0 18px;
    height: 42px;
    border: none;
    border-radius: 8px;
    background: #3370ff;
    color: #fff;
    font-size: 14px;
  }
  #send:disabled { background: #a8c0ff; }
</style>
</head>
<body>
<header>
  <h1>AI云</h1>
  <button id="reset" type="button">更换 Key</button>
</header>

<main id="messages">
  <div class="tip">输入内容开始对话</div>
</main>

<form id="form">
  <textarea id="input" placeholder="说点什么…"></textarea>
  <button id="send" type="submit">发送</button>
</form>

<script>
  var messagesEl = document.getElementById('messages');
  var form = document.getElementById('form');
  var input = document.getElementById('input');
  var sendBtn = document.getElementById('send');
  var pending = {};

  window.__onResult = function (id, jsonText) {
    var cb = pending[id];
    if (!cb) return;
    delete pending[id];
    var data;
    try { data = JSON.parse(jsonText); } catch (e) { data = { error: '返回解析失败' }; }
    cb(data);
  };

  function callChat(text) {
    return new Promise(function (resolve) {
      var id = 'c' + Date.now() + Math.floor(Math.random() * 1000);
      pending[id] = resolve;
      try {
        Android.chat(text, id);
      } catch (e) {
        delete pending[id];
        resolve({ error: '无法连接应用内核' });
      }
    });
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function renderTurn(t) {
    t.user.innerHTML = '';
    t.user.classList.toggle('editing', t.editing);

    if (t.editing) {
      var ta = document.createElement('textarea');
      ta.className = 'editor';
      ta.value = t.text;

      var actions = document.createElement('div');
      actions.className = 'actions';
      var save = document.createElement('button');
      save.type = 'button';
      save.className = 'btn-save';
      save.textContent = '保存并重新生成';
      var cancel = document.createElement('button');
      cancel.type = 'button';
      cancel.className = 'btn-cancel';
      cancel.textContent = '取消';
      actions.append(save, cancel);
      t.user.append(ta, actions);
      setTimeout(function () {
        ta.focus();
        ta.setSelectionRange(ta.value.length, ta.value.length);
      }, 0);
    } else {
      var span = document.createElement('span');
      span.textContent = t.text;
      var edit = document.createElement('button');
      edit.type = 'button';
      edit.className = 'edit';
      edit.textContent = '修改';
      t.user.append(span, edit);
    }
  }

  function newTurn(text) {
    var el = document.createElement('div');
    el.className = 'turn';

    var user = document.createElement('div');
    user.className = 'msg user';

    var bot = document.createElement('div');
    bot.className = 'msg bot pending';
    bot.textContent = '…';

    el.append(user, bot);
    messagesEl.appendChild(el);

    var t = { user: user, bot: bot, text: text, editing: false };
    el._turn = t;
    renderTurn(t);
    scrollToBottom();
    return t;
  }

  function ask(t) {
    t.bot.className = 'msg bot pending';
    t.bot.textContent = '…';
    return callChat(t.text).then(function (data) {
      t.bot.classList.remove('pending');
      if (data && data.reply) {
        t.bot.textContent = data.reply;
      } else {
        t.bot.classList.add('error');
        t.bot.textContent = (data && data.error) || '请求失败';
      }
      scrollToBottom();
    });
  }

  messagesEl.addEventListener('click', function (e) {
    var el = e.target.closest('.turn');
    if (!el || !el._turn) return;
    var t = el._turn;

    if (e.target.closest('.edit')) {
      t.editing = true;
      renderTurn(t);
    } else if (e.target.closest('.btn-cancel')) {
      t.editing = false;
      renderTurn(t);
    } else if (e.target.closest('.btn-save')) {
      var ta = t.user.querySelector('.editor');
      var value = ta.value.trim();
      if (!value) { ta.focus(); return; }
      t.text = value;
      t.editing = false;
      renderTurn(t);
      ask(t);
    }
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text || sendBtn.disabled) return;

    var tip = messagesEl.querySelector('.tip');
    if (tip) tip.remove();

    input.value = '';
    var t = newTurn(text);
    sendBtn.disabled = true;
    sendBtn.textContent = '思考中…';

    ask(t).then(function () {
      sendBtn.disabled = false;
      sendBtn.textContent = '发送';
    });
  });

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  document.getElementById('reset').addEventListener('click', function () {
    if (confirm('要更换 API Key 吗？')) {
      Android.resetKey();
    }
  });
</script>
</body>
</html>
