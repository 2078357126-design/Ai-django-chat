<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI云</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    background: #f5f6f8;
    color: #1f2329;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 16px;
    background: #fff;
    border-bottom: 1px solid #e8eaed;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; }
  header .header-actions { display: flex; gap: 6px; }
  header button {
    border: none;
    background: none;
    color: #8a9099;
    font-size: 12px;
    padding: 4px 4px;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    -webkit-overflow-scrolling: touch;
  }
  .tip { color: #8a9099; font-size: 13px; text-align: center; margin-top: 40px; }
  .turn {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user {
    align-self: flex-end;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    background: #3370ff;
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.user .msg-actions {
    align-self: flex-end;
    display: flex;
    gap: 10px;
    margin-top: 2px;
  }
  .msg.user .msg-actions button {
    padding: 0;
    border: none;
    background: none;
    color: rgba(255, 255, 255, .7);
    font-size: 11px;
  }
  .msg.user .msg-actions .delete { color: rgba(255, 220, 220, .85); }
  .msg.user.editing {
    width: 80%;
    max-width: 80%;
    background: #fff;
    border: 1px solid #d9dde3;
    color: #1f2329;
  }
  .msg.user.editing textarea {
    width: 100%;
    min-height: 52px;
    padding: 6px 8px;
    border: 1px solid #d9dde3;
    border-radius: 6px;
    font: inherit;
    font-size: 14px;
    resize: vertical;
    outline: none;
  }
  .msg.user.editing textarea:focus { border-color: #3370ff; }
  .msg.user .actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 8px;
  }
  .msg.user .actions button {
    height: 28px;
    padding: 0 10px;
    border: none;
    border-radius: 6px;
    font-size: 12px;
  }
  .btn-save { background: #3370ff; color: #fff; }
  .btn-cancel { background: #f2f3f5; color: #1f2329; }
  .msg.bot {
    align-self: flex-start;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    background: #fff;
    border: 1px solid #e8eaed;
    border-bottom-left-radius: 4px;
  }
  .msg.bot .speak {
    align-self: flex-end;
    margin-top: 2px;
    padding: 0;
    border: none;
    background: none;
    color: #8a9099;
    font-size: 11px;
  }
  .sticker-bubble { align-self: flex-start; }
  .sticker-bubble img { width: 96px; height: 96px; display: block; }
  .msg.error {
    align-self: flex-start;
    background: #fff1f0;
    color: #d4380d;
    border: 1px solid #ffccc7;
  }
  .msg.pending { color: #8a9099; }
  form {
    display: flex;
    gap: 8px;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: #fff;
    border-top: 1px solid #e8eaed;
  }
  #input {
    flex: 1;
    resize: none;
    height: 42px;
    padding: 10px 12px;
    font: inherit;
    font-size: 14px;
    border: 1px solid #d9dde3;
    border-radius: 8px;
    outline: none;
  }
  #input:focus { border-color: #3370ff; }
  #send {
    padding: 0 18px;
    height: 42px;
    border: none;
    border-radius: 8px;
    background: #3370ff;
    color: #fff;
    font-size: 14px;
  }
  #send:disabled { background: #a8c0ff; }
  /* 换了壁纸时，提示文字加一层底，保证看得清 */
  body.has-wallpaper .tip {
    color: #fff;
    background: rgba(0, 0, 0, .38);
    padding: 6px 12px;
    border-radius: 10px;
    align-self: center;
  }
</style>
</head>
<body>
<header>
  <h1 id="app-title">AI云</h1>
  <div class="header-actions">
    <button id="roles" type="button">角色</button>
    <button id="voice" type="button">语音</button>
    <button id="wallpaper" type="button">壁纸</button>
    <button id="update" type="button">更新</button>
    <button id="clear" type="button">清空</button>
    <button id="reset" type="button">更换 Key</button>
  </div>
</header>

<main id="messages">
  <div class="tip">输入内容开始对话</div>
</main>

<form id="form">
  <textarea id="input" placeholder="说点什么…"></textarea>
  <button id="send" type="submit">发送</button>
</form>

<script>
  var messagesEl = document.getElementById('messages');
  var form = document.getElementById('form');
  var input = document.getElementById('input');
  var sendBtn = document.getElementById('send');
  var pending = {};

  window.__onResult = function (id, jsonText) {
    var cb = pending[id];
    if (!cb) return;
    delete pending[id];
    var data;
    try { data = JSON.parse(jsonText); } catch (e) { data = { error: '返回解析失败' }; }
    cb(data);
  };

  function callChat(text) {
    return new Promise(function (resolve) {
      var id = 'c' + Date.now() + Math.floor(Math.random() * 1000);
      pending[id] = resolve;
      try {
        Android.chat(text, id);
      } catch (e) {
        delete pending[id];
        resolve({ error: '无法连接应用内核' });
      }
    });
  }

  var roleId = '';

  function storageKey() {
    if (!roleId && window.Android && typeof Android.activeRole === 'function') {
      roleId = Android.activeRole() || '';
    }
    return roleId ? 'aichat_' + roleId : 'aichat_history';
  }

  var turns = [];

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function saveHistory() {
    var data = turns.map(function (t) {
      return { text: t.text, reply: t.reply, error: t.error,
               proactive: t.proactive, sticker: t.sticker };
    });
    try { localStorage.setItem(storageKey(), JSON.stringify(data)); } catch (e) { /* 存储满时忽略 */ }
  }

  function showTip() {
    messagesEl.innerHTML = '';
    var tip = document.createElement('div');
    tip.className = 'tip';
    tip.textContent = '输入内容开始对话';
    messagesEl.appendChild(tip);
  }

  function hideTip() {
    var tip = messagesEl.querySelector('.tip');
    if (tip) tip.remove();
  }

  function renderBot(t) {
    t.bot.className = 'msg bot' + (t.error ? ' error' : '') + (t.pending ? ' pending' : '');
    t.bot.innerHTML = '';

    var span = document.createElement('span');
    span.textContent = t.pending ? '…' : (t.reply || '');
    t.bot.appendChild(span);

    if (!t.pending && t.reply && !t.error) {
      var speak = document.createElement('button');
      speak.type = 'button';
      speak.className = 'speak';
      speak.textContent = '朗读';
      t.bot.appendChild(speak);
    }
    renderSticker(t);
  }

  function renderSticker(t) {
    if (!t.stickerEl) return;
    if (!t.sticker) {
      t.stickerEl.style.display = 'none';
      t.stickerEl.innerHTML = '';
      t.stickerEl.removeAttribute('data-sticker');
      return;
    }
    t.stickerEl.style.display = '';
    if (t.stickerEl.getAttribute('data-sticker') === t.sticker) return;
    t.stickerEl.innerHTML = '';
    var img = document.createElement('img');
    img.src = 'stickers/' + t.sticker + '.svg';
    img.alt = '表情';
    t.stickerEl.appendChild(img);
    t.stickerEl.setAttribute('data-sticker', t.sticker);
  }

  // 情绪关键词 -> 表情图
  var STICKERS = {
    happy: ['哈哈', '笑死', '嘿嘿', '开心', '好耶', '😄', '😂', '🤣', '😊', '😆'],
    angry: ['哼', '生气', '气死', '烦', '讨厌', '😤', '😡', '💢'],
    sad: ['呜呜', '委屈', '难过', '想哭', '😭', '🥺'],
    shy: ['害羞', '脸红', '不好意思', '😳', '🙈'],
    shock: ['震惊', '卧槽', '离谱', '不会吧', '😱', '😨'],
    love: ['喜欢你', '想你', '爱你', '❤', '😍', '🥰'],
    smug: ['得意', '哼哼', '小样', '😏', '😎'],
    cat: ['喵', '猫猫', '🐱', '🐈']
  };

  function pickSticker(text) {
    if (!text) return '';
    for (var key in STICKERS) {
      var words = STICKERS[key];
      for (var i = 0; i < words.length; i++) {
        if (text.indexOf(words[i]) >= 0) return key;
      }
    }
    return '';
  }

  function stickerForReply(text) {
    var key = pickSticker(text);
    if (!key) return '';
    var prev = turns.length > 1 ? turns[turns.length - 2] : null;
    if (prev && prev.sticker) return '';
    if (Math.random() > 0.4) return '';
    return key;
  }

  function speakText(text) {
    if (!text) return;
    if (window.Android && Android.speak) {
      Android.speak(text);
    } else if (window.speechSynthesis) {
      try {
        speechSynthesis.cancel();
        speechSynthesis.speak(new SpeechSynthesisUtterance(text));
      } catch (e) { /* 浏览器不支持时忽略 */ }
    }
  }

  function renderTurn(t) {
    if (t.proactive) {
      t.user.innerHTML = '';
      t.user.style.display = 'none';
      return;
    }
    t.user.style.display = '';
    t.user.innerHTML = '';
    t.user.classList.toggle('editing', t.editing);

    if (t.editing) {
      var ta = document.createElement('textarea');
      ta.className = 'editor';
      ta.value = t.text;

      var actions = document.createElement('div');
      actions.className = 'actions';
      var save = document.createElement('button');
      save.type = 'button';
      save.className = 'btn-save';
      save.textContent = '保存并重新生成';
      var cancel = document.createElement('button');
      cancel.type = 'button';
      cancel.className = 'btn-cancel';
      cancel.textContent = '取消';
      actions.append(save, cancel);
      t.user.append(ta, actions);
      setTimeout(function () {
        ta.focus();
        ta.setSelectionRange(ta.value.length, ta.value.length);
      }, 0);
    } else {
      var span = document.createElement('span');
      span.textContent = t.text;

      var actions = document.createElement('div');
      actions.className = 'msg-actions';
      var edit = document.createElement('button');
      edit.type = 'button';
      edit.className = 'edit';
      edit.textContent = '修改';
      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'delete';
      del.textContent = '删除';
      actions.append(edit, del);
      t.user.append(span, actions);
    }
  }

  function addTurn(text, reply, error, proactive, sticker) {
    var el = document.createElement('div');
    el.className = 'turn';

    var user = document.createElement('div');
    user.className = 'msg user';

    var bot = document.createElement('div');
    bot.className = 'msg bot';

    var stickerEl = document.createElement('div');
    stickerEl.className = 'sticker-bubble';
    stickerEl.style.display = 'none';

    el.append(user, bot, stickerEl);
    messagesEl.appendChild(el);

    var t = {
      el: el,
      user: user,
      bot: bot,
      stickerEl: stickerEl,
      text: text,
      reply: reply || '',
      error: !!error,
      proactive: !!proactive,
      sticker: sticker || '',
      editing: false,
      pending: false
    };
    el._turn = t;
    turns.push(t);
    renderTurn(t);
    renderBot(t);
    renderSticker(t);
    return t;
  }

  function restoreHistory() {
    var saved;
    try { saved = JSON.parse(localStorage.getItem(storageKey()) || '[]'); } catch (e) { saved = []; }
    if (!Array.isArray(saved) || !saved.length) return;
    hideTip();
    saved.forEach(function (item) {
      addTurn(item.text || '', item.reply || '', !!item.error,
              !!item.proactive, item.sticker || '');
    });
    scrollToBottom();
  }

  function removeTurn(t) {
    var index = turns.indexOf(t);
    if (index < 0) return;
    turns.splice(index, 1);
    t.el.remove();
    saveHistory();
    if (!turns.length) showTip();
  }

  function clearAll() {
    turns = [];
    localStorage.removeItem(storageKey());
    showTip();
  }

  function requestDelete(t) {
    var index = turns.indexOf(t);
    if (index < 0) return;
    if (window.Android && Android.confirmDeleteTurn) {
      Android.confirmDeleteTurn(index);
    } else {
      removeTurn(t);
    }
  }

  // 供原生确认框回调
  window.__clearAll = clearAll;
  window.__deleteTurn = function (index) {
    var t = turns[index];
    if (t) removeTurn(t);
  };

  function ask(t) {
    t.pending = true;
    t.error = false;
    t.reply = '';
    t.sticker = '';
    renderBot(t);
    return callChat(t.text).then(function (data) {
      t.pending = false;
      if (data && data.reply) {
        t.reply = data.reply;
        t.error = false;
        if (!t.proactive) {
          t.sticker = stickerForReply(t.reply);
        }
      } else {
        t.reply = (data && data.error) || '请求失败';
        t.error = true;
        t.sticker = '';
      }
      renderBot(t);
      saveHistory();
      scrollToBottom();
    });
  }

  var PROACTIVE_PROMPT = '（现在是你在主动找对方说话：按你的人格随口说一句，20 字以内，'
      + '可以撒娇、吐槽或玩梗，不要提到这条提示，也不要重复上一句）';

  function maybeProactive() {
    if (document.hidden) return;
    if (Math.random() > 0.3) return;
    var t = addTurn('', '', false, true);
    t.pending = true;
    renderBot(t);
    callChat(PROACTIVE_PROMPT).then(function (data) {
      t.pending = false;
      if (data && data.reply) {
        t.reply = data.reply;
        t.error = false;
        renderBot(t);
        saveHistory();
        scrollToBottom();
      } else {
        removeTurn(t);
      }
    });
  }

  messagesEl.addEventListener('click', function (e) {
    var el = e.target.closest('.turn');
    if (!el || !el._turn) return;
    var t = el._turn;

    if (e.target.closest('.speak')) {
      speakText(t.reply);
    } else if (e.target.closest('.edit')) {
      t.editing = true;
      renderTurn(t);
    } else if (e.target.closest('.delete')) {
      requestDelete(t);
    } else if (e.target.closest('.btn-cancel')) {
      t.editing = false;
      renderTurn(t);
    } else if (e.target.closest('.btn-save')) {
      var ta = t.user.querySelector('.editor');
      var value = ta.value.trim();
      if (!value) { ta.focus(); return; }
      t.text = value;
      t.editing = false;
      renderTurn(t);
      ask(t);
    }
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text || sendBtn.disabled) return;

    hideTip();
    input.value = '';
    var t = addTurn(text);
    saveHistory();
    sendBtn.disabled = true;
    sendBtn.textContent = '思考中…';

    ask(t).then(function () {
      sendBtn.disabled = false;
      sendBtn.textContent = '发送';
      if (t.reply && !t.error) {
        setTimeout(maybeProactive, 1500);
      }
    });
  });

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  document.getElementById('roles').addEventListener('click', function () {
    if (window.Android && Android.showRoles) {
      Android.showRoles();
    } else {
      alert('角色管理请在 App 内使用');
    }
  });

  document.getElementById('update').addEventListener('click', function () {
    if (window.Android && Android.checkUpdate) {
      Android.checkUpdate();
    } else {
      alert('检查更新请在 App 内使用');
    }
  });

  document.getElementById('voice').addEventListener('click', function () {
    if (window.Android && Android.chooseVoice) {
      Android.chooseVoice();
    } else {
      alert('语音设置请在 App 内使用');
    }
  });

  document.getElementById('wallpaper').addEventListener('click', function () {
    if (window.Android && Android.chooseWallpaper) {
      Android.chooseWallpaper();
    } else {
      alert('更换壁纸请在 App 内使用');
    }
  });

  document.getElementById('clear').addEventListener('click', function () {
    if (window.Android && Android.confirmClearHistory) {
      Android.confirmClearHistory();
    } else {
      clearAll();
    }
  });

  document.getElementById('reset').addEventListener('click', function () {
    // 确认框由原生层弹出，避免 WebView 不支持 confirm 导致点击无效
    Android.resetKey();
  });

  // 使用自定义角色时，左上角标题显示角色名字
  var customRoleName = (window.Android && typeof Android.roleName === 'function')
      ? Android.roleName() : '';
  if (customRoleName) {
    document.getElementById('app-title').textContent = customRoleName;
    document.title = customRoleName;
  }

  // 聊天壁纸：由原生层按当前角色保存，进来时自动恢复
  window.__applyWallpaper = function (url) {
    if (url) {
      document.body.style.backgroundImage = 'url("' + url + '")';
      document.body.style.backgroundSize = 'cover';
      document.body.style.backgroundPosition = 'center';
      document.body.classList.add('has-wallpaper');
    } else {
      document.body.style.backgroundImage = '';
      document.body.classList.remove('has-wallpaper');
    }
  };
  if (window.Android && typeof Android.wallpaper === 'function') {
    try {
      window.__applyWallpaper(Android.wallpaper());
    } catch (e) { /* 拿不到壁纸时保持默认背景 */ }
  }

  // 延迟一拍，确保原生桥接已就绪后再读取角色和记录
  setTimeout(restoreHistory, 0);
</script>
</body>
</html>
