name: android-apk

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 构建 APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: 提交 APK
        run: |
          mkdir -p dist-android
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-android/AIChat-android.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist-android/AIChat-android.apk
          git commit -m "chore: 更新安卓安装包" || echo "无变化"
          git push
