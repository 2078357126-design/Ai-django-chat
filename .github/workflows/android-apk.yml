name: android-apk

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 准备固定签名
        run: |
          if [ ! -f android/keystore.jks ]; then
            keytool -genkeypair -v -keystore android/keystore.jks -alias aichat \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass aichat2026 -keypass aichat2026 \
              -dname "CN=AI Cloud, OU=Dev, O=AI, L=Beijing, S=Beijing, C=CN"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android/keystore.jks
            git commit -m "chore: 添加固定安卓签名"
            git push
          fi

      - name: 构建 APK
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee /tmp/gradle-build.log

      - name: 失败时记录日志
        if: failure()
        run: |
          mkdir -p dist-android
          tail -n 150 /tmp/gradle-build.log > dist-android/build-error.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist-android/build-error.txt
          git commit -m "chore: 记录构建错误" || true
          git push || true

      - name: 提交 APK
        run: |
          mkdir -p dist-android
          rm -f dist-android/build-error.txt
          cp android/app/build/outputs/apk/release/app-release.apk dist-android/AIChat-android.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist-android/AIChat-android.apk
          git commit -m "chore: 更新安卓安装包" || echo "无变化"
          git push
