name: build-desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            artifact: AIChat-macos-intel
          - os: macos-latest
            artifact: AIChat-macos-arm64
          - os: windows-latest
            artifact: AIChat-windows
          - os: ubuntu-latest
            artifact: AIChat-linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 预置 API Key
        shell: bash
        env:
          PRESET_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$PRESET_KEY" ]; then
            echo "未配置 OPENAI_API_KEY Secret，安装包将要求用户自行填写"
            exit 0
          fi
          printf 'OPENAI_API_KEY=%s\nOPENAI_BASE_URL=https://api.deepseek.com\nOPENAI_MODEL=deepseek-chat\n' "$PRESET_KEY" > preset.env

      - name: 下载本地推理组件
        if: runner.os != 'Windows'
        run: python scripts/fetch_llama.py

      - name: 下载本地推理组件（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "llama-b12556-bin-win-cpu-x64.zip"
          $url = "https://github.com/ggml-org/llama.cpp/releases/download/b12556/$name"
          Invoke-WebRequest -Uri $url -OutFile llama.zip
          Expand-Archive -Path llama.zip -DestinationPath llama_tmp -Force
          $bin = Get-ChildItem llama_tmp -Recurse -Filter llama-server.exe | Select-Object -First 1
          if (-not $bin) { throw "压缩包里没有找到 llama-server.exe" }
          New-Item -ItemType Directory -Force vendor/llama | Out-Null
          Copy-Item -Path (Join-Path $bin.Directory.FullName '*') -Destination vendor/llama -Recurse -Force

      - name: 打包
        run: pyinstaller --noconfirm --clean ai_chat.spec

      - name: 签名（macOS，未签名的子程序会被拦截）
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - dist/AIChat.app || true

      - name: 压缩（macOS）
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent AIChat.app ../${{ matrix.artifact }}.zip

      - name: 压缩（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/AIChat -DestinationPath ${{ matrix.artifact }}.zip

      - name: 压缩（Linux）
        if: runner.os == 'Linux'
        run: |
          cd dist
          zip -qry ../${{ matrix.artifact }}.zip AIChat

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 安装 NDK 与 CMake
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: 拉取 llama.cpp 源码
        run: |
          mkdir -p android/app/src/main/cpp/llama.cpp
          cd android/app/src/main/cpp/llama.cpp
          git init -q
          git remote add origin https://github.com/ggml-org/llama.cpp.git
          git fetch --depth 1 origin b94959a64d011915d77a5381c7d4846dcda99530
          git checkout -q FETCH_HEAD

      - name: 准备签名
        run: |
          if [ ! -f android/keystore.jks ]; then
            keytool -genkeypair -v -keystore android/keystore.jks -alias aichat \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass aichat2026 -keypass aichat2026 \
              -dname "CN=AI Cloud, OU=Dev, O=AI, L=Beijing, S=Beijing, C=CN"
          fi

      - name: 构建 APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 整理产物
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/AIChat-android.apk

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: AIChat-Android
          path: out/AIChat-android.apk

      - name: 发布 APK 到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/AIChat-android.apk
