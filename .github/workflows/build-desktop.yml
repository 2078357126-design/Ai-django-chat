name: build-desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 预置 API Key
        shell: bash
        env:
          PRESET_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$PRESET_KEY" ]; then
            echo "未配置 OPENAI_API_KEY Secret，安装包将要求用户自行填写"
            exit 0
          fi
          printf 'OPENAI_API_KEY=%s\nOPENAI_BASE_URL=https://api.deepseek.com\nOPENAI_MODEL=deepseek-flash\n' "$PRESET_KEY" > preset.env

      - name: 打包
        run: pyinstaller --noconfirm --clean ai_chat.spec

      - name: 压缩（macOS）
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent AIChat.app ../AIChat-macos.zip

      - name: 压缩（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/AIChat -DestinationPath AIChat-windows.zip

      - name: 压缩（Linux）
        if: runner.os == 'Linux'
        run: |
          cd dist
          zip -qry ../AIChat-linux.zip AIChat

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: AIChat-${{ runner.os }}
          path: AIChat-*.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 写入预置 Key
        shell: bash
        env:
          PRESET_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p android/app/src/main/assets
          printf 'OPENAI_API_KEY=%s\nOPENAI_BASE_URL=https://api.deepseek.com\nOPENAI_MODEL=deepseek-flash\n' "$PRESET_KEY" > android/app/src/main/assets/app-config.properties

      - name: 构建 APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 整理产物
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/AIChat-android.apk

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: AIChat-Android
          path: out/AIChat-android.apk

  release:
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/AIChat-*.zip
            artifacts/AIChat-android.apk
          body: |
            安装包（解压即用，首次打开在页面填写 DeepSeek API Key）。

            - macOS：解压后双击 AIChat.app（首次需右键 → 打开）
            - Windows：解压后运行 AIChat\AIChat.exe
            - Linux：解压后运行 AIChat/AIChat
            - Android：安装 AIChat-android.apk，首次打开填写电脑地址（手机与电脑需同一 WiFi）
            - iPhone：用 Safari 打开网页版，添加到主屏幕
