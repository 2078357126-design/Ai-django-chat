name: android-apk

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 安装 NDK 与 CMake
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: 拉取 llama.cpp 源码
        run: |
          mkdir -p android/app/src/main/cpp/llama.cpp
          cd android/app/src/main/cpp/llama.cpp
          git init -q
          git remote add origin https://github.com/ggml-org/llama.cpp.git
          git fetch --depth 1 origin b94959a64d011915d77a5381c7d4846dcda99530
          git checkout -q FETCH_HEAD

      - name: 准备固定签名
        run: |
          if [ ! -f android/keystore.jks ]; then
            keytool -genkeypair -v -keystore android/keystore.jks -alias aichat \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass aichat2026 -keypass aichat2026 \
              -dname "CN=AI Cloud, OU=Dev, O=AI, L=Beijing, S=Beijing, C=CN"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android/keystore.jks
            git commit -m "chore: 添加固定安卓签名"
            git push
          fi

      - name: 构建 APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: 提交 APK
        run: |
          mkdir -p dist-android
          cp android/app/build/outputs/apk/release/app-release.apk dist-android/AIChat-android.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist-android/AIChat-android.apk
          git commit -m "chore: 更新安卓安装包" || echo "无变化"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break
            sleep 5
          done
