<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI云</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    background: #f5f6f8;
    color: #1f2329;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    padding: 14px 16px;
    background: #fff;
    border-bottom: 1px solid #e8eaed;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header .title-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; white-space: nowrap; }
  .header-avatar-btn {
    padding: 0 !important;
    border-radius: 50%;
    flex: none;
  }
  .role-avatar.header-avatar { width: 30px; height: 30px; }
  .role-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    object-fit: cover;
    background: #fff;
    border: 1px solid #e8eaed;
    display: block;
    flex: none;
  }
  header .header-actions { display: flex; gap: 4px; }
  header button {
    border: none;
    background: none;
    color: #8a9099;
    font-size: 11px;
    padding: 4px 3px;
  }
  #messages {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    -webkit-overflow-scrolling: touch;
  }
  .tip { color: #8a9099; font-size: 13px; text-align: center; margin-top: 40px; }
  .turn {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user {
    align-self: flex-end;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    background: #3370ff;
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.user .msg-actions {
    align-self: flex-end;
    display: flex;
    gap: 10px;
    margin-top: 2px;
  }
  .msg.user .msg-actions button {
    padding: 0;
    border: none;
    background: none;
    color: rgba(255, 255, 255, .7);
    font-size: 11px;
  }
  .msg.user .msg-actions .delete { color: rgba(255, 220, 220, .85); }
  .msg.user.editing {
    width: 80%;
    max-width: 80%;
    background: #fff;
    border: 1px solid #d9dde3;
    color: #1f2329;
  }
  .msg.user.editing textarea {
    width: 100%;
    min-height: 52px;
    padding: 6px 8px;
    border: 1px solid #d9dde3;
    border-radius: 6px;
    font: inherit;
    font-size: 14px;
    resize: vertical;
    outline: none;
  }
  .msg.user.editing textarea:focus { border-color: #3370ff; }
  .msg.user .actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 8px;
  }
  .msg.user .actions button {
    height: 28px;
    padding: 0 10px;
    border: none;
    border-radius: 6px;
    font-size: 12px;
  }
  .btn-save { background: #3370ff; color: #fff; }
  .btn-cancel { background: #f2f3f5; color: #1f2329; }
  .bot-line {
    align-self: flex-start;
    display: flex;
    align-items: flex-start;
    gap: 8px;
    max-width: 92%;
  }
  .bot-stack {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    min-width: 0;
  }
  .msg.bot {
    align-self: flex-start;
    max-width: 100%;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    background: #fff;
    border: 1px solid #e8eaed;
    border-bottom-left-radius: 4px;
  }
  .msg.bot .speak {
    align-self: flex-end;
    margin-top: 2px;
    padding: 0;
    border: none;
    background: none;
    color: #8a9099;
    font-size: 11px;
  }
  .sticker-bubble {
    align-self: flex-start;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    max-width: 160px;
  }
  .sticker-bubble img { width: 96px; height: 96px; display: block; }
  .sticker-cap {
    font-size: 11px;
    line-height: 1.4;
    color: #6b7280;
    background: #fff;
    border: 1px solid #e8eaed;
    border-radius: 999px;
    padding: 1px 8px;
    white-space: nowrap;
  }
  body.has-wallpaper .sticker-cap {
    color: #fff;
    background: rgba(0, 0, 0, .45);
    border-color: transparent;
  }
  .msg.error {
    align-self: flex-start;
    background: #fff1f0;
    color: #d4380d;
    border: 1px solid #ffccc7;
  }
  .msg.pending { color: #8a9099; }
  /* 更新通知：像一条系统消息，不打断当前操作 */
  .msg.notice {
    align-self: center;
    width: 100%;
    max-width: 92%;
    background: #eef3ff;
    border: 1px solid #c9d8ff;
    color: #1f2329;
    font-size: 12px;
    line-height: 1.6;
    border-radius: 10px;
  }
  .notice-head {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .notice-head span { flex: 1; }
  .notice-close {
    padding: 0 2px;
    border: none;
    background: none;
    color: #8a9099;
    font-size: 15px;
    line-height: 1;
  }
  .notice-actions { display: flex; gap: 8px; margin-top: 8px; }
  .notice-actions button {
    height: 26px;
    padding: 0 10px;
    border: none;
    border-radius: 6px;
    font-size: 12px;
    background: #3370ff;
    color: #fff;
  }
  .notice-actions button.ghost { background: #fff; color: #3370ff; }
  form {
    display: flex;
    gap: 8px;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: #fff;
    border-top: 1px solid #e8eaed;
  }
  #input {
    flex: 1;
    resize: none;
    height: 42px;
    padding: 10px 12px;
    font: inherit;
    font-size: 14px;
    border: 1px solid #d9dde3;
    border-radius: 8px;
    outline: none;
  }
  #input:focus { border-color: #3370ff; }
  #send {
    padding: 0 18px;
    height: 42px;
    border: none;
    border-radius: 8px;
    background: #3370ff;
    color: #fff;
    font-size: 14px;
  }
  #send:disabled { background: #a8c0ff; }
  /* 换了壁纸时，提示文字加一层底，保证看得清 */
  body.has-wallpaper .tip {
    color: #fff;
    background: rgba(0, 0, 0, .38);
    padding: 6px 12px;
    border-radius: 10px;
    align-self: center;
  }
  /* 通用弹窗（模型面板） */
  .sheet-mask {
    position: fixed;
    inset: 0;
    background: rgba(15, 20, 30, .45);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 999;
  }
  .sheet {
    width: 100%;
    max-width: 560px;
    max-height: 82vh;
    background: #fff;
    border-radius: 16px 16px 0 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    font-size: 14px;
    color: #1f2329;
  }
  .sheet-head {
    padding: 16px 18px 8px;
    font-size: 16px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .sheet-head button {
    border: none;
    background: none;
    color: #3370ff;
    font-size: 14px;
  }
  .sheet-body {
    padding: 4px 18px 18px;
    overflow-y: auto;
  }
  .sheet-hint {
    font-size: 12px;
    color: #8a9099;
    line-height: 1.55;
    padding: 2px 0 10px;
  }
  .model-row {
    border: 1px solid #eef0f3;
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .model-row.active { border-color: #c9d8ff; background: #f5f8ff; }
  .model-top {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .model-name { font-weight: 600; }
  .model-tag {
    font-size: 11px;
    color: #3370ff;
    background: #eaf0ff;
    border-radius: 6px;
    padding: 1px 6px;
  }
  .model-desc { font-size: 12px; color: #8a9099; line-height: 1.5; margin-top: 4px; }
  .model-meta { font-size: 11px; color: #a0a6ad; margin-top: 4px; }
  .model-actions {
    display: flex;
    gap: 8px;
    margin-top: 8px;
    flex-wrap: wrap;
  }
  .model-actions button {
    height: 30px;
    padding: 0 12px;
    border: none;
    border-radius: 8px;
    font-size: 12px;
    background: #f2f3f5;
    color: #1f2329;
  }
  .model-actions button.primary { background: #3370ff; color: #fff; }
  .model-actions button.danger { background: transparent; color: #d4380d; }
  .model-bar {
    height: 4px;
    background: #eef0f3;
    border-radius: 2px;
    overflow: hidden;
    margin-top: 8px;
  }
  .model-bar span {
    display: block;
    height: 100%;
    background: #3370ff;
    width: 0;
  }
</style>
</head>
<body>
<header>
  <div class="title-wrap">
    <button id="avatar" class="header-avatar-btn" type="button" title="角色头像">
      <img id="header-avatar" class="role-avatar header-avatar" src="icon.svg" alt="角色头像">
    </button>
    <h1 id="app-title">AI云</h1>
  </div>
  <div class="header-actions">
    <button id="models" type="button">模型</button>
    <button id="roles" type="button">角色</button>
    <button id="voice" type="button">语音</button>
    <button id="wallpaper" type="button">壁纸</button>
    <button id="update" type="button">更新</button>
    <button id="clear" type="button">清空</button>
    <button id="reset" type="button">更换 Key</button>
  </div>
</header>

<main id="messages">
  <div class="tip">输入内容开始对话</div>
</main>

<form id="form">
  <textarea id="input" placeholder="说点什么…"></textarea>
  <button id="send" type="submit">发送</button>
</form>

<script>
  var messagesEl = document.getElementById('messages');
  var form = document.getElementById('form');
  var input = document.getElementById('input');
  var sendBtn = document.getElementById('send');
  var pending = {};
  var pendingTurns = {};

  // 最近几轮对话带给模型，让它记得上文；太长会占满上下文，所以按条数和字数双限
  var MAX_HISTORY_MESSAGES = 16;
  var MAX_HISTORY_CHARS = 4000;

  function chatHistory() {
    var list = [];
    for (var i = 0; i < turns.length; i++) {
      var t = turns[i];
      if (t.pending || t.editing) continue;
      if (t.text) list.push({ role: 'user', content: t.text });
      if (t.reply && !t.error) list.push({ role: 'assistant', content: cleanReply(t.reply) });
    }
    var picked = [];
    var total = 0;
    for (var j = list.length - 1; j >= 0 && picked.length < MAX_HISTORY_MESSAGES; j--) {
      total += list[j].content.length;
      if (total > MAX_HISTORY_CHARS) break;
      picked.unshift(list[j]);
    }
    return picked;
  }

  function callChat(text, turn) {
    return new Promise(function (resolve) {
      var id = 'c' + Date.now() + Math.floor(Math.random() * 1000);
      pending[id] = resolve;
      if (turn) pendingTurns[id] = turn;
      try {
        Android.chat(text, id, JSON.stringify(chatHistory()));
      } catch (e) {
        delete pending[id];
        delete pendingTurns[id];
        resolve({ error: '无法连接应用内核' });
      }
    });
  }

  /** 本地模型流式输出：边生成边显示。 */
  window.__onDelta = function (id, text) {
    var turn = pendingTurns[id];
    if (!turn || !text) return;
    turn.pending = false;
    turn.reply = (turn.reply || '') + text;
    renderBot(turn);
    scrollToBottom();
  };

  window.__onResult = function (id, jsonText) {
    var cb = pending[id];
    delete pendingTurns[id];
    if (!cb) return;
    delete pending[id];
    var data;
    try { data = JSON.parse(jsonText); } catch (e) { data = { error: '返回解析失败' }; }
    cb(data);
  };

  var roleId = '';

  function storageKey() {
    if (!roleId && window.Android && typeof Android.activeRole === 'function') {
      roleId = Android.activeRole() || '';
    }
    return roleId ? 'aichat_' + roleId : 'aichat_history';
  }

  var turns = [];
  var currentAvatar = 'icon.svg';

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function saveHistory() {
    var data = turns.map(function (t) {
      return { text: t.text, reply: t.reply, error: t.error,
               proactive: t.proactive, sticker: t.sticker };
    });
    try { localStorage.setItem(storageKey(), JSON.stringify(data)); } catch (e) { /* 存储满时忽略 */ }
  }

  function showTip() {
    messagesEl.innerHTML = '';
    var tip = document.createElement('div');
    tip.className = 'tip';
    tip.textContent = '输入内容开始对话';
    messagesEl.appendChild(tip);
  }

  function hideTip() {
    var tip = messagesEl.querySelector('.tip');
    if (tip) tip.remove();
  }

  // 模型偶尔会带 Markdown 标记，聊天气泡里统一转成纯文本
  function cleanReply(text) {
    if (!text) return '';
    var out = text;
    out = out.replace(/```[a-zA-Z]*\n?/g, '');
    out = out.replace(/^\s{0,3}#{1,6}\s*/gm, '');
    out = out.replace(/^\s{0,3}>\s?/gm, '');
    out = out.replace(/\*\*([^*]+)\*\*/g, '$1');
    out = out.replace(/__([^_]+)__/g, '$1');
    out = out.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1$2');
    out = out.replace(/~~([^~]+)~~/g, '$1');
    out = out.replace(/`([^`]+)`/g, '$1');
    out = out.replace(/^\s*[-+*]\s+/gm, '');
    out = out.replace(/^\s*\d+\.\s+/gm, '');
    out = out.replace(/\n{3,}/g, '\n\n');
    return out.trim();
  }

  function renderBot(t) {
    t.bot.className = 'msg bot' + (t.error ? ' error' : '') + (t.pending ? ' pending' : '');
    t.bot.innerHTML = '';

    var span = document.createElement('span');
    span.textContent = t.pending ? '…' : cleanReply(t.reply || '');
    t.bot.appendChild(span);

    if (!t.pending && t.reply && !t.error) {
      var speak = document.createElement('button');
      speak.type = 'button';
      speak.className = 'speak';
      speak.textContent = '朗读';
      t.bot.appendChild(speak);
    }
    renderSticker(t);
  }

  function renderSticker(t) {
    if (!t.stickerEl) return;
    if (!t.sticker) {
      t.stickerEl.style.display = 'none';
      t.stickerEl.innerHTML = '';
      t.stickerEl.removeAttribute('data-sticker');
      return;
    }
    t.stickerEl.style.display = '';
    if (t.stickerEl.getAttribute('data-sticker') === t.sticker) return;
    t.stickerEl.innerHTML = '';
    var img = document.createElement('img');
    img.src = 'stickers/' + t.sticker + '.svg';
    img.alt = '表情';
    t.stickerEl.appendChild(img);
    var caption = STICKER_CAPTIONS[t.sticker];
    if (caption) {
      var cap = document.createElement('span');
      cap.className = 'sticker-cap';
      cap.textContent = caption;
      t.stickerEl.appendChild(cap);
    }
    t.stickerEl.setAttribute('data-sticker', t.sticker);
  }

  // 表情库：图源 OpenMoji（CC BY-SA 4.0）
  // 一个情绪给多张候选图，命中多条规则时随机选一条，避免每次都一样

    { words: ['笑死', '笑不活', '笑喷', '绷不住', '蚌埠住', '乐死', '哈哈哈', '哈哈', '嘿嘿', '233', '🤣', '😂', '😆'],
      stickers: ['laugh', 'happy', 'zany', 'hundred', 'party', 'skull'] },

      stickers: ['clown', 'upside', 'melt', 'woozy', 'dizzy', 'moai', 'dotted', 'mindblown'] },
    { words: ['无语', '服了', '没眼看', '翻白眼', '白眼', '就这', '呵呵', '🙄', '🤦'],
      stickers: ['facepalm', 'eyeroll', 'blank', 'deadpan', 'moai', 'sweat'] },
    { words: ['震惊', '卧槽', '不会吧', '真的假的', '吓', '啊这', '天呐', '我的天', '惊了', '😱', '😨'],
      stickers: ['scream', 'shock', 'mindblown', 'boom', 'alien'] },
    { words: ['哼', '生气', '气死', '烦死', '讨厌', '滚', '骂', '混蛋', '💢', '😤', '😡', '🤬'],
      stickers: ['angry', 'swearing', 'fire', 'panda'] },
    { words: ['呜呜', '委屈', '难过', '想哭', '哭死', '大哭', '伤心', 'emo', '酸了', '柠檬', '羡慕', '🥺', '😭'],
      stickers: ['sad', 'cry', 'pleading', 'lemon', 'melt'] },
    { words: ['求求', '拜托', '好不好', '行不行', '求你了', '🙏'],
      stickers: ['pleading', 'pray', 'peek', 'hug'] },
    { words: ['害羞', '脸红', '不好意思', '别夸', '😳', '🙈'],

      stickers: ['love', 'hearts', 'kiss', 'fingerheart'] },

    { words: ['加油', '冲鸭', '你可以', '别怕', '稳住', '支棱', '打起精神'],
      stickers: ['biceps', 'fire', 'rocket', 'trophy', 'hug'] },
    { words: ['吃瓜', '八卦', '细说', '说说看', '有瓜', '围观', '看戏', '🍿'],

    { words: ['吃饭', '干饭', '饿了', '火锅', '烧烤', '奶茶', '好吃', '夜宵'],

    { words: ['土豪', '有钱', '红包', '发财', '暴富', '工资', '买单', '💰', '💸'],
      stickers: ['money', 'redenv', 'gem', 'crown'] },
    { words: ['明星', '顶流', '出道', '红毯', '签名', '舞台', '开唱', '唱歌', '开麦', 'KTV', '粉丝', 'C位', '合影', '拍照', '🎤'],
      stickers: ['star', 'gem', 'studiolmic', 'mic', 'camera', 'crown', 'trophy'] },
    { words: ['恐怖', '鬼', '幽灵', '害怕'],
      stickers: ['ghost', 'scream', 'alien'] },
    { words: ['喵', '猫猫', '小猫', '🐱', '🐈'],

  function pickSticker(text) {
    if (!text) return '';
    var matched = [];
    for (var i = 0; i < STICKER_RULES.length; i++) {
      var words = STICKER_RULES[i].words;
      for (var j = 0; j < words.length; j++) {
        if (text.indexOf(words[j]) >= 0) {
          matched.push(STICKER_RULES[i].stickers);
          break;
        }
      }
    }
    if (!matched.length) return '';
    var pool = matched[Math.floor(Math.random() * matched.length)];

    // 避开最近出现过的表情，连续聊同个话题也有新鲜感
    var recent = [];
    for (var k = Math.max(0, turns.length - 3); k < turns.length; k++) {
      if (turns[k] && turns[k].sticker) recent.push(turns[k].sticker);
    }
    for (var t = 0; t < 6; t++) {
      var id = pool[Math.floor(Math.random() * pool.length)];
      if (recent.indexOf(id) < 0) return id;
    }
    return pool[0];
  }

  function stickerForReply(text) {
    if (!text) return '';
    if (Math.random() > 0.55) return '';
    return pickSticker(text);
  }

  function speakText(text) {
    if (!text) return;
    if (window.Android && Android.speak) {
      Android.speak(text);

        speechSynthesis.speak(new SpeechSynthesisUtterance(text));
      } catch (e) { /* 浏览器不支持时忽略 */ }
    }
  }

    hideTip();

  function ask(t) {
    t.pending = true;
    t.error = false;
    t.reply = '';
    t.sticker = '';
    renderBot(t);
    return callChat(t.text, t).then(function (data) {
      t.pending = false;
      if (data && data.reply) {
        t.reply = data.reply;
        t.error = false;
        if (!t.proactive) {
          t.sticker = stickerForReply(t.reply);
        }
      } else {
        t.reply = (data && data.error) || '请求失败';
        t.error = true;
        t.sticker = '';
      }
      renderBot(t);
      saveHistory();
      scrollToBottom();
    });
  }

  function formatSize(bytes) {
    if (!bytes) return '';
    if (bytes >= 1024 * 1024 * 1024) return (bytes / 1024 / 1024 / 1024).toFixed(1) + ' GB';
    return Math.round(bytes / 1024 / 1024) + ' MB';
  }

  function refreshModels() {
    var result;
    try {
      result = (window.Android && Android.listModels) ? Android.listModels() : '[]';
    } catch (e) {
      result = '[]';
    }
    Promise.resolve(result).then(function (raw) {
      var list;
      try { list = typeof raw === 'string' ? JSON.parse(raw) : raw; } catch (e) { list = []; }
      modelList = Array.isArray(list) ? list : [];
      renderModelList();
    });
  }

  function modelButton(label, cls, onClick) {
    var button = document.createElement('button');
    button.type = 'button';
    button.textContent = label;
    if (cls) button.className = cls;
    button.addEventListener('click', onClick);
    return button;
  }

  function renderModelList() {
    if (!modelPanel) return;
    var list = modelPanel.querySelector('.model-list');
    if (!list) return;
    list.innerHTML = '';

    modelList.forEach(function (model) {
      var row = document.createElement('div');
      row.className = 'model-row' + (model.active ? ' active' : '');

      var top = document.createElement('div');
      top.className = 'model-top';
      var name = document.createElement('span');
      name.className = 'model-name';
      name.textContent = model.name;
      top.appendChild(name);
      if (model.active) {
        var tag = document.createElement('span');
        tag.className = 'model-tag';
        tag.textContent = '使用中';
        top.appendChild(tag);
      }
      if (model.vision) {
        var visionTag = document.createElement('span');
        visionTag.className = 'model-tag';
        visionTag.textContent = '带视觉';
        top.appendChild(visionTag);
      }
      row.appendChild(top);

      var desc = document.createElement('div');
      desc.className = 'model-desc';
      desc.textContent = model.desc || '';
      row.appendChild(desc);

      var meta = document.createElement('div');
      meta.className = 'model-meta';
      var parts = [];
      if (model.ram) parts.push('内存 ' + model.ram);
      if (model.size) parts.push('下载 ' + formatSize(model.size));
      if (model.downloading) parts.push('下载中 ' + (model.progress || 0) + '%');
      else if (model.installed) parts.push('已下载');
      meta.textContent = parts.join(' · ');
      row.appendChild(meta);

      if (model.downloading) {
        var bar = document.createElement('div');
        bar.className = 'model-bar';
        var fill = document.createElement('span');
        fill.style.width = Math.max(2, model.progress || 0) + '%';
        bar.appendChild(fill);
        row.appendChild(bar);
      }

      var actions = document.createElement('div');
      actions.className = 'model-actions';

      if (!model.active && (model.id === 'cloud' || model.installed)) {
        actions.appendChild(modelButton('使用', 'primary', function () {
          try { Android.selectModel(model.id); } catch (e) { /* 忽略 */ }
          modelList.forEach(function (item) { item.active = item.id === model.id; });
          renderModelList();
        }));
      }
      if (model.id !== 'cloud' && !model.installed && !model.downloading) {
        actions.appendChild(modelButton('下载', 'primary', function () {
          try { Android.downloadModel(model.id); } catch (e) { /* 忽略 */ }
          model.downloading = true;
          model.progress = 0;
          renderModelList();
        }));
      }
      if (model.downloading) {
        actions.appendChild(modelButton('暂停', '', function () {
          try {
            if (Android.cancelModelDownload) Android.cancelModelDownload(model.id);
          } catch (e) { /* 忽略 */ }
        }));
      }
      if (model.id !== 'cloud' && model.installed) {
        actions.appendChild(modelButton('删除', 'danger', function () {
          if (!confirm('确定删除「' + model.name + '」吗？删除后需要重新下载。')) return;
          try { Android.deleteModel(model.id); } catch (e) { /* 忽略 */ }
          setTimeout(refreshModels, 300);
        }));
      }
      if (actions.children.length) {
        row.appendChild(actions);
      }
      list.appendChild(row);
    });
  }

  window.__onModelProgress = function (jsonText) {

      if (modelList[i].id === info.id) {
        model = modelList[i];
        break;

    }
    if (!model) return;
    model.downloading = !info.done;
    model.progress = info.progress || 0;
    if (info.done) model.installed = true;
    if (info.error) {
      model.downloading = false;
      alert(info.error);
    }
    renderModelList();
    if (info.done) refreshModels();

  window.__applyWallpaper = function (url) {
    if (url) {
      document.body.style.backgroundImage = 'url("' + url + '")';
      document.body.style.backgroundSize = 'cover';
      document.body.style.backgroundPosition = 'center';
      document.body.classList.add('has-wallpaper');
    } else {
      document.body.style.backgroundImage = '';
      document.body.classList.remove('has-wallpaper');
    }
  };
  if (window.Android && typeof Android.wallpaper === 'function') {
    try {
      window.__applyWallpaper(Android.wallpaper());
    } catch (e) { /* 拿不到壁纸时保持默认背景 */ }
  }

  // 更新通知：像一条消息出现在聊天里，所有角色都能看到；
  // 同一版本点过关闭后不再打扰，发了新版本会再通知
  window.__showUpdateNotice = function (raw) {
    var info = raw;
    if (typeof raw === 'string') {
      try { info = JSON.parse(raw); } catch (e) { return; }
    }
    if (!info || info.notify === false) return;
    var version = (info.version || '').trim();
    var notes = (info.notes || '').trim();
    if (!notes) return;
    var key = 'aichat_update_notice_' + (version || 'unknown');
    try {
      if (localStorage.getItem(key) === 'closed') return;
    } catch (e) { /* 忽略 */ }

    var old = document.getElementById('update-notice');
    if (old) old.remove();

    var box = document.createElement('div');
    box.id = 'update-notice';
    box.className = 'msg notice';

    var head = document.createElement('div');
    head.className = 'notice-head';
    var title = document.createElement('span');
    title.textContent = info.newVersion
      ? '发现新版本 ' + version
      : '更新内容 · ' + version;
    var close = document.createElement('button');
    close.type = 'button';
    close.className = 'notice-close';
    close.textContent = '×';
    close.addEventListener('click', function () {
      try { localStorage.setItem(key, 'closed'); } catch (e) { /* 忽略 */ }
      box.remove();
    });
    head.append(title, close);
    box.appendChild(head);

    var body = document.createElement('div');
    body.textContent = notes;
    box.appendChild(body);

    if (info.newVersion && info.url) {
      var actions = document.createElement('div');
      actions.className = 'notice-actions';
      var updateBtn = document.createElement('button');
      updateBtn.type = 'button';
      updateBtn.textContent = '立即更新';
      updateBtn.addEventListener('click', function () {
        if (window.Android && typeof Android.openUpdate === 'function') {
          Android.openUpdate(info.url);
        } else {
          window.open('https://github.com/2078357126-design/Ai-django-chat/releases/latest', '_blank');
        }
      });
      actions.appendChild(updateBtn);
      box.appendChild(actions);
    }

    messagesEl.appendChild(box);
    scrollToBottom();
  };

  // 延迟一拍，确保原生桥接已就绪后再读取角色和记录
  setTimeout(restoreHistory, 0);

  // 原生层已经拿到更新说明时直接显示，页面后加载也不会漏
  if (window.Android && typeof Android.updateNotice === 'function') {
    try {
      var pendingNotice = Android.updateNotice();
      if (pendingNotice) window.__showUpdateNotice(pendingNotice);
    } catch (e) { /* 忽略 */ }
  }
</script>
</body>
</html>
